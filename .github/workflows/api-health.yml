name: API health

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-health-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Repository secrets (Settings → Secrets and variables → Actions).
      # Do not use Environment secrets: this job has no `environment:`.
      # Duo cannot finish on the runner, so Degree Explorer stays auth_required
      # on a healthy UTORauth 302. Do not store UOFT_MFA_CODE here.
      - name: Probe APIs
        env:
          UOFT_UTORID: ${{ secrets.UOFT_UTORID }}
          UOFT_PASSWORD: ${{ secrets.UOFT_PASSWORD }}
        run: python src/check_all_api.py --output "$RUNNER_TEMP/health-site/status.json"

      - name: Upload status
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/health-site

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Publish status
        id: deployment
        uses: actions/deploy-pages@v4
